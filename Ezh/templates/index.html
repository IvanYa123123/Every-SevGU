<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ежедневник СевГУ</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f8fafc; /* slate-50 */
            --card-bg: #ffffff;
            --text-main: #1e293b; /* slate-800 */
            --text-muted: #64748b; /* slate-500 */
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.03);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.06);
            --radius-card: 16px;
            --radius-pill: 20px;
            --radius-btn: 10px;
            
            /* Status colors (modern tags) */
            --status-green-bg: #ecfdf5;
            --status-green-text: #065f46;
            --status-green-border: #d1fae5;
            
            --status-orange-bg: #fff7ed;
            --status-orange-text: #9a3412;
            --status-orange-border: #ffedd5;
            
            --status-red-bg: #fef2f2;
            --status-red-text: #991b1b;
            --status-red-border: #fee2e2;
        }

        body { 
            background-color: var(--bg-color); 
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding-bottom: 40px;
        }

        .top-bar-container {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-soft);
            padding: 12px 20px;
            margin-bottom: 20px;
            position: sticky;
            top: 15px;
            z-index: 1000;
        }

        .form-control, .form-select {
            border-radius: 8px;
            border-color: #e2e8f0;
            padding: 6px 12px;
            box-shadow: none !important;
            transition: border-color 0.2s;
            font-size: 0.9em;
        }
        .form-control:focus, .form-select:focus { border-color: #6366f1; }
        
        .btn {
            border-radius: var(--radius-btn);
            font-weight: 500;
            padding: 6px 14px;
            transition: all 0.2s;
            font-size: 0.9em;
        }
        .btn-primary { background-color: #6366f1; border-color: #6366f1; }
        .btn-primary:hover { background-color: #4f46e5; border-color: #4f46e5; }
        .btn-outline-primary { color: #6366f1; border-color: #c7d2fe; }
        .btn-outline-primary:hover { background-color: #e0e7ff; border-color: #c7d2fe; color: #4338ca; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; width: 100%; }
        
        .day-col { 
            background: var(--card-bg); border-radius: 12px; padding: 12px; 
            box-shadow: var(--shadow-soft); min-height: 280px; 
            display: flex; flex-direction: column; border: 1px solid transparent;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .day-col:hover { box-shadow: var(--shadow-hover); }
        
        .day-header { 
            text-align: center; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; 
            border-bottom: 1px solid #f1f5f9; color: var(--text-muted); font-size: 0.85em; text-transform: uppercase;
        }
        
        .day-today { border: 2px solid #6366f1; background-color: #f8fafc; }
        .day-today .day-header { color: #6366f1; border-bottom-color: #c7d2fe; font-weight: 700; }

        .task-card { 
            padding: 8px 24px 8px 10px; margin-bottom: 8px; border-radius: 8px; 
            cursor: grab; font-size: 0.8em; position: relative; font-weight: 500;
            border: 1px solid transparent; line-height: 1.3;
        }
        .task-card:active { cursor: grabbing; transform: scale(0.98); }
        .task-text { cursor: pointer; display: block; }
        .task-delete { 
            position: absolute; top: 50%; transform: translateY(-50%); right: 6px; 
            cursor: pointer; font-weight: bold; color: rgba(0,0,0,0.3); font-size: 1.1em; 
            width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
        .task-delete:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        
        .status-green { background-color: var(--status-green-bg); color: var(--status-green-text); border-color: var(--status-green-border); }
        .status-orange { background-color: var(--status-orange-bg); color: var(--status-orange-text); border-color: var(--status-orange-border); }
        .status-red { background-color: var(--status-red-bg); color: var(--status-red-text); border-color: var(--status-red-border); }
        .task-completed { opacity: 0.6; text-decoration: line-through; background-color: #f1f5f9 !important; color: #94a3b8 !important; border-color: #e2e8f0 !important; }
        
        .schedule-item { 
            border-left: 3px solid #6366f1; background: #f8fafc; padding: 8px 10px; 
            margin-bottom: 8px; font-size: 0.8em; border-radius: 0 6px 6px 0; color: var(--text-main); line-height: 1.3;
        }
        .add-task-btn { font-size: 0.85em; cursor: pointer; color: #6366f1; display: inline-block; margin-top: 4px; font-weight: 500; transition: color 0.2s; }
        .add-task-btn:hover { color: #4338ca; text-decoration: underline; }

        .schedule-summary { 
            background-color: #f1f5f9; color: #475569; padding: 6px 10px; border-radius: 6px; 
            font-size: 0.8em; font-weight: 600; cursor: pointer; text-align: center; user-select: none; margin-bottom: 10px; transition: background 0.2s;
        }
        .schedule-summary:hover { background-color: #e2e8f0; }
        
        .widget-card { 
            border-radius: var(--radius-card); box-shadow: var(--shadow-soft); background: var(--card-bg); 
            padding: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-bottom: 16px; border: none;
        }
        .widget-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        
        .nav-arrow { font-size: 1.8rem; color: #cbd5e1; background: none; border: none; padding: 0 10px; cursor: pointer; transition: color 0.2s, transform 0.2s; }
        .nav-arrow:hover { color: #6366f1; transform: scale(1.1); }

        .friend-col { 
            background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 6px; 
            padding: 6px; min-height: 60px; display: flex; flex-direction: column; transition: background 0.2s;
        }
        .friend-col:hover { background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
        
        .shared-class {
            background: var(--status-green-bg); color: var(--status-green-text); border: 1px solid var(--status-green-border);
            padding: 4px; border-radius: 4px; margin-bottom: 4px; font-size: 0.7em; text-align: center; font-weight: 500; line-height: 1.2;
        }
        .friend-day-header {
            text-align: center; font-weight: 600; font-size: 0.7em; color: var(--text-muted);
            margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px dashed #e2e8f0; text-transform: uppercase;
        }

        /* Compact wrapper for friends generated via JS */
        #friendsCalendarsContainer > div {
            border-radius: 12px !important; border: 1px solid #f1f5f9 !important; box-shadow: var(--shadow-soft) !important;
            padding: 12px 16px 16px 16px !important; margin-bottom: 16px !important; background: white;
        }

        #globalLoader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.85); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }

        #friendTogglesDropdown .dropdown-item { cursor: pointer; border-radius: 6px; margin: 2px 8px; width: auto; font-size: 0.9em; }
        #friendTogglesDropdown .dropdown-item:hover { background-color: #f1f5f9; }
        
        .modal-content { border-radius: 12px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .modal-header { border-bottom: 1px solid #f1f5f9; }
        .modal-footer { border-top: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div id="globalLoader" style="display: none;">
    <div class="spinner-border" style="width: 3rem; height: 3rem; color: #6366f1;" role="status"></div>
    <div id="loaderText" class="mt-3 fw-semibold text-secondary fs-5" style="min-height: 30px; text-align: center;">Загрузка...</div>
</div>

<!-- Toast Container for custom alerts -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
  <div id="appToast" class="toast align-items-center text-white bg-danger border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body fw-medium" id="toastBody" style="font-size: 0.9em;"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<div class="container-fluid p-3 p-md-4">
    <div class="top-bar-container row align-items-center mx-1">
        <div class="col-md-3 mb-2 mb-md-0">
            <h5 class="mb-0 fw-bold" style="color: #0f172a;"><span class="me-2 fs-5">📅</span>Ежедневник</h5>
        </div>
        <div class="col-md-4 mb-2 mb-md-0">
            <div class="input-group input-group-sm">
                <input type="text" id="groupSelect" class="form-control" list="groupList" placeholder="Учебная группа...">
                <datalist id="groupList"></datalist>
                <select id="subgroupSelect" class="form-select" style="max-width: 110px;" onchange="fetchSemesterData()">
                    <option value="0">Все подгр.</option>
                    <option value="1">1 подгр.</option>
                    <option value="2">2 подгр.</option>
                </select>
                <button class="btn btn-primary" onclick="fetchSemesterData()">Найти</button>
            </div>
        </div>
        <div class="col-md-5 d-flex align-items-center justify-content-md-end justify-content-start">
            <button class="btn btn-outline-primary btn-sm me-3 fw-semibold" onclick="goToToday()">Сегодня</button>
            <span class="fs-6 fw-semibold text-secondary bg-light px-3 py-1 rounded-pill border" id="weekDisplay"></span>
        </div>
    </div>

    <div class="row px-1">
        <!-- Main Calendar Area -->
        <div class="col-xl-9 col-lg-8 mb-4">
            <div class="d-flex align-items-stretch w-100">
                <div class="d-flex align-items-center">
                    <button class="nav-arrow" onclick="changeWeek(-1)">&#10094;</button>
                </div>
                
                <div class="w-100 d-flex flex-column">
                    <!-- Calendar Grid -->
                    <div class="calendar-grid flex-grow-1" id="calendar"></div>
                    
                    <div class="mt-3 text-start d-flex align-items-center flex-wrap gap-2 mb-2 bg-white p-2 rounded-3 shadow-sm border-0" id="friendsControlsPanel">
                        <button class="btn btn-sm btn-outline-primary fw-semibold" onclick="showAddFriendModal()">+ Добавить друга</button>
                        <div class="vr mx-2 text-muted" style="opacity: 0.15;"></div>
                        
                        <div class="dropdown d-flex align-items-center">
                            <button class="btn btn-sm text-white dropdown-toggle fw-semibold shadow-sm" style="background: #0ea5e9; border-color: #0ea5e9;" type="button" id="friendsDropdown" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                                Кого показывать?
                            </button>
                            <!-- Background Loader -->
                            <div id="friendsLoader" class="spinner-border spinner-border-sm text-info ms-3" role="status" style="display: none;"></div>
                            
                            <ul class="dropdown-menu shadow border-0 mt-2 p-2" aria-labelledby="friendsDropdown" id="friendTogglesDropdown" style="min-width: 250px; border-radius: 10px;">
                                <!-- Checkboxes injected via JS -->
                            </ul>
                        </div>
                    </div>
                    
                    <!-- Friends Calendars Wrapper -->
                    <div id="friendsCalendarsContainer" class="d-flex flex-column mb-4"></div>
                </div>
                
                <div class="d-flex align-items-center">
                    <button class="nav-arrow" onclick="changeWeek(1)">&#10095;</button>
                </div>
            </div>
        </div>
        
        <div class="col-xl-3 col-lg-4">
            <!-- Global Stats Widget -->
            <div class="widget-card sticky-top" style="top: 15px;" onclick="showStats()">
                <h6 class="text-center mb-2 fw-bold" style="color: #334155; font-size: 0.95em;">Общие пары</h6>
                <div style="position: relative; height: 140px;">
                    <canvas id="globalStatsChart"></canvas>
                </div>
            </div>
            
            <!-- Labs Widget -->
            <div class="widget-card sticky-top" style="top: 230px;" onclick="showLabs()">
                <h6 class="text-center mb-2 fw-bold" style="color: #334155; font-size: 0.95em;">Лабораторные</h6>
                <div style="position: relative; height: 140px;">
                    <canvas id="labStatsChart"></canvas>
                </div>
            </div>

            <!-- Lab Pacing Widget -->
            <div class="widget-card sticky-top" style="top: 445px; max-height: 350px; overflow-y: auto; cursor: default;">
                <h6 class="text-center mb-1 fw-bold" style="color: #334155; font-size: 0.95em;">Темп сдачи лаб (План)</h6>
                <div class="text-muted text-center mb-3" style="font-size: 0.7em;">Сдано / Должно быть к сегодня</div>
                <div id="labPacingContent"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Custom Confirm -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <h6 id="confirmText" class="mb-4 text-slate-800 fw-semibold lh-base"></h6>
        <button type="button" class="btn btn-light border btn-sm px-3 me-2 fw-medium" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-danger btn-sm px-3 fw-medium" id="confirmBtn">Подтвердить</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Add Friend -->
<div class="modal fade" id="addFriendModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title fw-bold fs-6">Добавить друга</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-muted mb-1">Имя (или ник)</label>
            <input type="text" id="friendName" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold text-muted mb-1">Группа</label>
            <input type="text" id="friendGroup" class="form-control" list="groupList">
        </div>
        <div class="mb-2">
            <label class="form-label small fw-semibold text-muted mb-1">Подгруппа</label>
            <select id="friendSubgroup" class="form-select">
                <option value="0">Все подгруппы</option>
                <option value="1">1 подгруппа</option>
                <option value="2">2 подгруппа</option>
            </select>
        </div>
      </div>
      <div class="modal-footer py-2 border-top-0 justify-content-center">
        <button type="button" class="btn btn-primary px-4 w-100" onclick="saveFriend()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Stats -->
<div class="modal fade" id="statsModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-3">
        <h6 class="modal-title fw-bold">Остаток пар по предметам</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body bg-light" id="statsContent"></div>
    </div>
  </div>
</div>

<!-- Modal: Labs -->
<div class="modal fade" id="labsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-3">
        <h6 class="modal-title fw-bold">Управление лабораторными</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="labsContent"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentBaseDate = new Date(); 
    currentBaseDate.setDate(currentBaseDate.getDate() - (currentBaseDate.getDay() === 0 ? 6 : currentBaseDate.getDay() - 1));
    
    let cachedSchedule = []; 
    let cachedLabs = {};
    let globalChart = null;
    let globalLabChart = null;
    let currentSubjectsList = []; 

    let validGroups = new Set(); 
    let groupsLoaded = false;
    let friendsList = []; 
    let friendsSchedules = {};
    let visibleFriends = new Set(); 

    const loadingPhrases = [
        "Грызем гранит науки...",
        "Связываемся с деканатом...",
        "Ищем расписание...",
        "Раскладываем пары по полочкам...",
        "Будим преподавателей...",
        "Проверяем наличие окон..."
    ];

    let loaderInterval;

    function showGlobalLoader() { 
        let idx = Math.floor(Math.random() * loadingPhrases.length);
        let el = document.getElementById('loaderText');
        el.textContent = loadingPhrases[idx];
        document.getElementById('globalLoader').style.display = 'flex'; 
        
        // Loop text every 3 seconds
        loaderInterval = setInterval(() => {
            idx = (idx + 1) % loadingPhrases.length;
            el.textContent = loadingPhrases[idx];
        }, 3000);
    }
    
    function hideGlobalLoader() { 
        document.getElementById('globalLoader').style.display = 'none'; 
        clearInterval(loaderInterval);
    }

    function showFriendsLoader() { document.getElementById('friendsLoader').style.display = 'block'; }
    function hideFriendsLoader() { document.getElementById('friendsLoader').style.display = 'none'; }

    // Custom alerts to replace default browser prompts
    function customAlert(msg, type='danger') {
        let toastEl = document.getElementById('appToast');
        let toastBody = document.getElementById('toastBody');
        toastEl.className = `toast align-items-center text-white bg-${type} border-0 shadow-lg`;
        toastBody.textContent = msg;
        let toast = new bootstrap.Toast(toastEl);
        toast.show();
    }

    function customConfirm(msg, callback) {
        document.getElementById('confirmText').textContent = msg;
        let modal = new bootstrap.Modal(document.getElementById('confirmModal'));
        let btn = document.getElementById('confirmBtn');
        
        // Remove old listeners to prevent multiple fires
        let newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        
        newBtn.onclick = () => {
            modal.hide();
            callback();
        };
        modal.show();
    }

    async function ensureGroupsLoaded() {
        if (groupsLoaded) return;
        try {
            let r = await fetch('/api/groups');
            let groups = await r.json();
            const list = document.getElementById("groupList");
            if(groups && Array.isArray(groups)) {
                groups.forEach(g => {
                    let name = typeof g === 'string' ? g : (g.name || g.title || JSON.stringify(g));
                    validGroups.add(name.trim().toUpperCase());
                    if(list) list.innerHTML += `<option value="${name}">`;
                });
            }
            groupsLoaded = true;
        } catch(e) { console.log("Справочник групп недоступен."); }
    }

    function getLocalDateStr(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    document.addEventListener("DOMContentLoaded", async () => {
        showGlobalLoader();
        await ensureGroupsLoaded(); 

        if(localStorage.getItem('savedGroup')) {
            document.getElementById('groupSelect').value = localStorage.getItem('savedGroup');
            if(localStorage.getItem('savedSubgroup')) {
                document.getElementById('subgroupSelect').value = localStorage.getItem('savedSubgroup');
            }
            await fetchSemesterData(); 
        } else {
            renderCalendar();
            renderCharts();
            hideGlobalLoader();
            fetchFriends(); 
        }
    });

    function goToToday() {
        currentBaseDate = new Date();
        currentBaseDate.setDate(currentBaseDate.getDate() - (currentBaseDate.getDay() === 0 ? 6 : currentBaseDate.getDay() - 1));
        renderCalendar();
    }

    async function fetchSemesterData() {
        const group = document.getElementById("groupSelect").value.trim();
        const subgroup = document.getElementById("subgroupSelect").value;
        if(!group) return;

        showGlobalLoader();
        await ensureGroupsLoaded(); 

        if (validGroups.size > 0 && !validGroups.has(group.toUpperCase())) {
            hideGlobalLoader();
            customAlert(`Учебная группа "${group}" не найдена. Пожалуйста, выберите существующую.`);
            return;
        }

        localStorage.setItem('savedGroup', group);
        localStorage.setItem('savedSubgroup', subgroup);
        
        document.getElementById("calendar").innerHTML = "<h6 class='text-center w-100 mt-5 text-muted'>Загрузка семестра...</h6>";

        try {
            let res = await fetch(`/api/schedule_all?group=${encodeURIComponent(group)}&subgroup=${subgroup}`);
            cachedSchedule = await res.json();
            await updateLabsCache();
            renderCalendar();
            renderCharts();
        } catch (e) {
            document.getElementById("calendar").innerHTML = `<h6 class='text-center text-danger w-100 mt-5'>Ошибка загрузки</h6>`;
            customAlert('Не удалось загрузить расписание. Проверьте соединение.');
        }
        
        hideGlobalLoader(); 
        fetchFriends(); 
    }

    async function updateLabsCache() {
        const group = document.getElementById("groupSelect").value.trim();
        if(!group) return;
        let res = await fetch(`/api/labs?group=${encodeURIComponent(group)}`);
        cachedLabs = await res.json();
    }

    function renderCharts() {
        let passed = 0;
        let remaining = 0;
        let todayStr = getLocalDateStr(new Date());

        cachedSchedule.forEach(item => {
            if(item.date < todayStr) passed++;
            else remaining++;
        });

        const ctx1 = document.getElementById('globalStatsChart').getContext('2d');
        if(globalChart) {
            globalChart.data.datasets[0].data = [passed, remaining];
            globalChart.update();
        } else {
            globalChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['Прошло', 'Осталось'],
                    datasets: [{
                        data: [passed, remaining],
                        backgroundColor: ['#6366f1', '#e2e8f0'], // Modern Indigo and Light Slate
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
            });
        }

        let totLabs = 0;
        let compLabs = 0;
        for (let subj in cachedLabs) {
            totLabs += cachedLabs[subj].total;
            compLabs += cachedLabs[subj].completed;
        }
        let uncompLabs = totLabs - compLabs;
        if (uncompLabs < 0) uncompLabs = 0;

        let labData = totLabs === 0 ? [0, 1] : [compLabs, uncompLabs];
        let labColors = totLabs === 0 ? ['#f1f5f9', '#f1f5f9'] : ['#14b8a6', '#f59e0b']; // Modern Teal and Amber

        const ctx2 = document.getElementById('labStatsChart').getContext('2d');
        if(globalLabChart) {
            globalLabChart.data.datasets[0].data = labData;
            globalLabChart.data.datasets[0].backgroundColor = labColors;
            globalLabChart.update();
        } else {
            globalLabChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: totLabs === 0 ? ['Нет данных', ''] : ['Сдано', 'Осталось'],
                    datasets: [{
                        data: labData,
                        backgroundColor: labColors,
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
            });
        }

        renderLabPacing();
    }

    function renderLabPacing() {
        const container = document.getElementById('labPacingContent');
        if (!cachedLabs || Object.keys(cachedLabs).length === 0) {
            container.innerHTML = "<div class='text-center text-muted' style='font-size: 0.8em;'>Нет данных</div>";
            return;
        }

        let today = new Date();
        let expectedRatio = 0;
        
        let fallStart = new Date(today.getFullYear(), 8, 1); 
        let fallEnd = new Date(today.getFullYear(), 11, 15); 
        let springStart = new Date(today.getFullYear(), 1, 1); 
        let springEnd = new Date(today.getFullYear(), 4, 31); 
        
        if (today >= fallStart && today <= new Date(today.getFullYear(), 11, 31)) {
            if (today > fallEnd) expectedRatio = 1;
            else expectedRatio = (today - fallStart) / (fallEnd - fallStart);
        } else if (today >= springStart && today <= new Date(today.getFullYear(), 5, 30)) {
            if (today > springEnd) expectedRatio = 1;
            else expectedRatio = (today - springStart) / (springEnd - springStart);
        } else if (today.getMonth() === 0 || today.getMonth() === 6 || today.getMonth() === 7) {
            expectedRatio = 1; 
        }

        let html = '<div class="list-group list-group-flush">';
        for (let subj in cachedLabs) {
            let data = cachedLabs[subj];
            if (data.total === 0) continue;
            
            let expectedCount = Math.round(data.total * expectedRatio);
            let actualCount = data.completed;
            
            let statusClass = actualCount >= expectedCount ? 'text-success' : 'text-danger';
            let icon = actualCount >= expectedCount ? '✅' : '⚠️';

            html += `
                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                    <span class="text-truncate me-2 text-slate-700" style="max-width: 65%; font-size: 0.8em;" title="${subj}">${subj}</span>
                    <span class="fw-bold ${statusClass}" style="font-size: 0.8em; white-space: nowrap;">
                        ${actualCount} / ${expectedCount} ${icon}
                    </span>
                </div>
            `;
        }
        html += '</div>';
        
        if (html === '<div class="list-group list-group-flush"></div>') {
            html = "<div class='text-center text-muted' style='font-size: 0.8em;'>Нет лаб для сдачи</div>";
        }
        container.innerHTML = html;
    }

        let endD = new Date(currentBaseDate);

        let endFormat = endD.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

        for(let i = 0; i < 7; i++) {
            let d = new Date(currentBaseDate);
            d.setDate(d.getDate() + i);
            let dateStr = getLocalDateStr(d);
            let displayDate = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });

                scheduleHtml += `
                    <div class="schedule-summary" onclick="toggleSchedule('${dateStr}')">
                        🕒 ${startTime} - ${endTime} <span id="arrow-${dateStr}">▼</span>
                    </div>
                    <div id="schedule-details-${dateStr}" style="display: none;">
                `;
                
                daySchedule.forEach(item => {
                    let safeLesson = item.lesson.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                    scheduleHtml += `
                        <div class="schedule-item">
                            <strong>${item.time_range}</strong><br>
                            ${item.lesson}<br>

                                + Создать задачу
                            </span>
                        </div>
                    `;
                });

            }

            cal.innerHTML += `
                <div class="day-col ${isTodayClass}" ondragover="allowDrop(event)" ondrop="drop(event, '${dateStr}')">
                    <div class="day-header">${displayDate}</div>
                    <div class="mb-2">${scheduleHtml}</div>
                    <div id="tasks-${dateStr}" style="flex-grow: 1; min-height: 40px;"></div>
                    <div class="text-center mt-2">
                        <button class="btn btn-outline-primary btn-sm rounded-circle shadow-sm fw-bold border-0 bg-light" 
                                style="width: 26px; height: 26px; line-height: 12px; padding: 0;" 
                                onclick="toggleTaskInput('${dateStr}')" title="Добавить задачу">+</button>
                    </div>

                        <input type="text" id="task-input-${dateStr}" class="form-control" style="font-size: 0.8em;"

        let details = document.getElementById(`schedule-details-${dateStr}`);
        let arrow = document.getElementById(`arrow-${dateStr}`);
        if(details.style.display === "none") {
            details.style.display = "block";
            arrow.textContent = "▲";
        } else {
            details.style.display = "none";
            arrow.textContent = "▼";
        }
    }

    function toggleTaskInput(dateStr) {
        let wrap = document.getElementById(`task-input-wrap-${dateStr}`);
        let input = document.getElementById(`task-input-${dateStr}`);
        if(wrap.style.display === "none") {
            wrap.style.display = "block";
            input.focus();
        } else {
            wrap.style.display = "none";
        }
    }

    function handleNewTask(e, dateStr) {
        if(e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
    }

    function handleTaskBlur(dateStr) {
        setTimeout(() => {
            let input = document.getElementById(`task-input-${dateStr}`);
            let wrap = document.getElementById(`task-input-wrap-${dateStr}`);
            if(input && input.value.trim() !== '') {
                createTask(dateStr, input.value.trim(), 'green');
                input.value = '';
            }
            if(wrap) wrap.style.display = "none";
        }, 150);
    }

    function createTaskFromSchedule(date, text) {
        let decodedText = text.replace(/&#39;/g, "'").replace(/&quot;/g, '"');
        createTask(date, decodedText, 'orange');
    }

    async function createTask(date, text, status) {
        try {
            let res = await fetch('/api/tasks', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({date, text, status})
            });
            let data = await res.json();
            renderTask({id: data.id, date, text, status});
        } catch(e) { customAlert("Не удалось создать задачу."); }
    }

    function renderTask(task) {
        const container = document.getElementById(`tasks-${task.date}`);
        if(!container) return;
        
        let existing = document.getElementById(`task-${task.id}`);
        if(existing) existing.remove();
        
        let div = document.createElement('div');
        div.className = `task-card status-${task.status}`;
        div.id = `task-${task.id}`;
        div.draggable = true;
        
        let spanText = document.createElement('span');
        spanText.className = 'task-text';
        spanText.textContent = task.text;
        
        spanText.onclick = () => { if(task.status !== 'completed') toggleColor(task.id, task.status); };
        
        let spanDel = document.createElement('span');
        spanDel.className = 'task-delete';
        
        if (task.status === 'completed') {
            div.classList.add('task-completed');
            spanDel.innerHTML = '&times;'; 
            spanDel.style.fontSize = '1.2em';
        } else {
            spanDel.innerHTML = '&times;';
        }
        
        spanDel.onclick = () => handleTaskDeleteClick(task);
        
        div.appendChild(spanText);
        div.appendChild(spanDel);
        
        div.ondragstart = (e) => { e.dataTransfer.setData("text/plain", JSON.stringify(task)); };
        container.appendChild(div);
    }

    async function handleTaskDeleteClick(task) {
        if (task.status !== 'completed') {
            task.status = 'completed';
            await fetch(`/api/tasks/${task.id}`, {
                method: 'PUT', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({date: task.date, text: task.text, status: 'completed'})
            });
            renderTask(task); 
        } else {
            await fetch(`/api/tasks/${task.id}`, { method: 'DELETE' });
            document.getElementById(`task-${task.id}`).remove(); 
        }
    }

    async function toggleColor(id, currentStatus) {
        let taskElement = document.getElementById(`task-${id}`);
        let newStatus = currentStatus === 'green' ? 'orange' : (currentStatus === 'orange' ? 'red' : 'green');
        let textNode = taskElement.querySelector('.task-text');
        let text = textNode.textContent;
        let dateId = taskElement.parentElement.id.replace('tasks-', '');

        await fetch(`/api/tasks/${id}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({date: dateId, text: text, status: newStatus})
        });
        
        taskElement.className = `task-card status-${newStatus}`;
        textNode.onclick = () => toggleColor(id, newStatus);
        taskElement.ondragstart = (e) => { 
            e.dataTransfer.setData("text/plain", JSON.stringify({id, date: dateId, text, status: newStatus})); 
        };
    }

    function allowDrop(e) { e.preventDefault(); }
    
    async function drop(e, newDate) {
        e.preventDefault();
        let taskData = JSON.parse(e.dataTransfer.getData("text/plain"));
        if(taskData.date === newDate) return;

        await fetch(`/api/tasks/${taskData.id}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({date: newDate, text: taskData.text, status: taskData.status})
        });

        let oldEl = document.getElementById(`task-${taskData.id}`);
        if(oldEl) oldEl.remove();
        taskData.date = newDate;
        renderTask(taskData);
    }

    async function saveAllLabs() {
        const group = document.getElementById("groupSelect").value.trim();
        let payload = [];
        let hasErrors = false;

        currentSubjectsList.forEach((subject, idx) => {
            let compInput = document.getElementById(`lab-comp-${idx}`);
            let totInput = document.getElementById(`lab-tot-${idx}`);
            if(!compInput || !totInput) return;

            let comp = parseInt(compInput.value) || 0;
            let tot = parseInt(totInput.value) || 0;

            if (comp > tot) {
                comp = tot;
                compInput.value = comp; 
                hasErrors = true;
            }

            payload.push({ group: group, subject: subject, completed: comp, total: tot });
        });

        if (hasErrors) {
            customAlert("Количество сданных лаб превышало общее. Значения исправлены.", 'warning');
        }

        try {
            await fetch('/api/labs', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            await updateLabsCache(); 
            renderCharts(); 
            renderLabsContent(); 
            
            let modal = bootstrap.Modal.getInstance(document.getElementById('labsModal'));
            if (modal) modal.hide();
            
            if(!hasErrors) customAlert("Данные сохранены успешно!", "success");
        } catch (e) {
            customAlert("Ошибка сохранения", "danger");
        }
    }

                let dateStr = getLocalDateStr(d);
                let displayDate = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
                
                let daySchedule = friendSched.filter(item => item.date === dateStr);
                daySchedule.sort((a, b) => a.n - b.n);
                
                let myDaySchedule = cachedSchedule.filter(item => item.date === dateStr);
                myDaySchedule.sort((a, b) => a.n - b.n);
                
                let html = `<div class="friend-col">`;
                html += `<div class="friend-day-header">${displayDate}</div>`;
                
                if (daySchedule.length > 0) {
                    let fStart = daySchedule[0].time_range.split(' - ')[0];
                    let fEnd = daySchedule[daySchedule.length - 1].time_range.split(' - ')[1] || '';
                    
                    html += `<div class="fw-bold mb-1 text-center" style="font-size: 0.75em; color: #6366f1;">🕒 ${fStart} - ${fEnd}</div>`;
                    
                    let myStart = myDaySchedule.length > 0 ? myDaySchedule[0].time_range.split(' - ')[0] : null;
                    let myEnd = myDaySchedule.length > 0 ? (myDaySchedule[myDaySchedule.length - 1].time_range.split(' - ')[1] || '') : null;
                    
                    if (myStart && fStart === myStart) { html += `<div class="shared-class fw-bold">🏃 Начинаем вместе в ${fStart}</div>`; }
                    if (myEnd && fEnd && fEnd === myEnd) { html += `<div class="shared-class fw-bold">🏡 Заканчиваем вместе в ${fEnd}</div>`; }
                    
                    let sharedLessonsFound = false;
                    daySchedule.forEach(fItem => {
                        let match = myDaySchedule.find(mItem => mItem.n === fItem.n && mItem.lesson === fItem.lesson);
                        if (match) {
                            let safeLesson = match.lesson.replace(/"/g, '&quot;');
                            html += `<div class="shared-class" title="${safeLesson}">🤝 ${match.time_range.split(' - ')[0]} общ. пара</div>`;
                            sharedLessonsFound = true;
                        }
                    });
                    
                    if (!sharedLessonsFound && !(myStart && fStart === myStart) && !(myEnd && fEnd && fEnd === myEnd)) {
                        html += `<div class="text-muted text-center mt-1" style="font-size: 0.7em;">Совпадений нет</div>`;
                    }
                } else {
                    html += `<div class="text-muted text-center mt-2" style="font-size: 0.75em;">Выходной</div>`;
                }
                
                html += `</div>`;
                gridHtml += html;
            }
            
            grid.innerHTML = gridHtml;
            wrapper.appendChild(grid);
            container.appendChild(wrapper);
        });
        
        if (!anyVisible) {
            container.innerHTML = `<div class="text-center text-muted small py-3 bg-white rounded-4 shadow-sm border">Выберите друзей в панели «Кого показывать?», чтобы сравнить расписание.</div>`;
        }
    }
</script>
</body>
</html>
